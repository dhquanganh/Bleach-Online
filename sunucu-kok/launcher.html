<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Bleach Online (yerel)</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #c8c8c8;
      font: 15px/1.5 system-ui, sans-serif;
      overflow: hidden;
    }

    /* Oyun sahnesi: 1250x650 mantiksal boyut, pencereye SIGDIRILARAK olceklenir (CSS transform).
     Client stage'i NO_SCALE kullandigi icin nesne boyutunu buyutmek degil, olceklemek gerekir. */
    #sahne {
      position: absolute;
      left: 0;
      top: 0;
      width: 1250px;
      height: 650px;
      transform-origin: 0 0;
    }

    #flashContent {
      width: 1250px;
      height: 650px;
    }

    #uyari {
      position: absolute;
      left: 0;
      right: 0;
      top: 40%;
      text-align: center;
      padding: 0 16px;
    }

    #ust { position:fixed;right:12px;top:10px;z-index:50; }
    .btn-s { padding:7px 12px;border:1px solid #66503b;border-radius:6px;background:#171522;color:#ffcd87;cursor:pointer; }
  </style>
  <script src="/api/js/swfobject.js"></script>
</head>

<body>
  <div id="sahne">
    <div id="flashContent"></div>
  </div>
  <div id="uyari"></div>

  <div id="ust">
    <button class="btn-s" id="btnSigdir" title="Ctrl+Shift+F">Fit / Original</button>
  </div>

  <script>
    // ================= OYUN =================
    var base = location.origin + '/public/';
    var oturum = null;
    try { var x = new XMLHttpRequest(); x.open('GET', '/yerel/oturum.json', false); x.send(); if (x.status === 200) oturum = JSON.parse(x.responseText); } catch (e) { }
    if (!oturum) location.replace('/login');
    var originalFetch = window.fetch;
    window.fetch = function (url, options) { options = options || {}; options.credentials = 'include'; return originalFetch.call(window, url, options).then(function (r) { if (r.status === 401) location.replace('/login'); return r; }); };
    var accountBar = document.createElement('div');
    accountBar.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:999999;background:#171522;color:#ffcd87;padding:8px 12px;border:1px solid #66503b;border-radius:7px;font:14px Arial';
    var accountName = document.createElement('span'); accountName.textContent = oturum ? oturum.username + '  ' : ''; accountBar.appendChild(accountName);
    var logoutButton = document.createElement('button'); logoutButton.textContent = 'Đăng xuất'; logoutButton.onclick = function () { logoutButton.disabled = true; fetch('/auth/logout', { method: 'POST' }).then(function (r) { if (!r.ok) throw new Error(); location.href = '/login'; }).catch(function () { logoutButton.disabled = false; alert('Chưa lưu được dữ liệu. Vui lòng thử lại.'); }); }; accountBar.appendChild(logoutButton); document.body.appendChild(accountBar);
    var dil = null;
    try { var y = new XMLHttpRequest(); y.open('GET', '/yerel/dil', false); y.send(); if (y.status === 200) dil = JSON.parse(y.responseText); } catch (e) { }

    if (!swfobject.hasFlashPlayerVersion('11.0.0')) {
      document.getElementById('uyari').textContent = 'Bu tarayıcıda Flash çalışmıyor. Oyun yalnız kendi Flash 22 çalışma zamanıyla (OYUNU-BASLAT.bat) açılır.';
    } else if (oturum) {
      var flashvars = oturum || {
        gatewayIP: '127.0.0.1', gatewayPort: '10025', isCombin: '0', cdnRoot: base,
        username: 'yerel', flag: '1', isAdult: '1', time: String(Math.floor(Date.now() / 1000)),
        agent: '54', server: '974', version: '2026090619', token: 'yerel',
        // isNew=1 SART: client karakter-yaratma ekranini (TProcessorCreateChar) YALNIZ bu bayrakla kurar;
        // 0 iken sunucunun CreateCharCmd'i bosa gider ve "Currently initializing player data" ekraninda kalinir.
        // Karakteri olan hesapta zararsiz: ekran gizli kurulur, giris normal devam eder.
        payurl: 'http://127.0.0.1:7421/topup', fightreporturl: '', support: '', officeurl: '', isNew: '1', lang: (dil && dil.kod) || 'en'
      };
      // Refresh the bootstrap and its resource map together, independent of the
      // account session's original client version. Preserve login credentials.
      var clientRelease = null;
      try {
        var releaseRequest = new XMLHttpRequest();
        releaseRequest.open('GET', base + 'client-release.json?t=' + Date.now(), false);
        releaseRequest.send();
        if (releaseRequest.status === 200) clientRelease = JSON.parse(releaseRequest.responseText);
      } catch (e) { }
      if (clientRelease && /^\d{10}$/.test(String(clientRelease.version))) flashvars.version = String(clientRelease.version);
      var revisionLabel = document.createElement('span');
      revisionLabel.textContent = '  Client ' + flashvars.version;
      revisionLabel.style.cssText = 'font-size:11px;color:#aaa;margin-left:8px';
      accountBar.appendChild(revisionLabel);
      swfobject.embedSWF(base + flashvars.version + '/index.swf?release=' + flashvars.version, 'flashContent', '1250', '650', '11.0.0', false, flashvars,
        { quality: 'high', bgcolor: '#000000', allowfullscreen: 'true', allowscriptaccess: 'always', wmode: 'transparent' },
        { id: 'loading', name: 'loading', align: 'middle' });
    }

    // ================= SIGDIRMA (tam ekran destegi) =================
    var SIGDIR = true;
    try { SIGDIR = localStorage.getItem('bleach.sigdir') !== '0'; } catch (e) { }
    function yerlestir() {
      var W = window.innerWidth, H = window.innerHeight;
      var k = SIGDIR ? Math.min(W / 1250, H / 650) : 1;
      var s = document.getElementById('sahne');
      var x = Math.max(0, (W - 1250 * k) / 2), y = Math.max(0, (H - 650 * k) / 2);
      s.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')';
      document.getElementById('btnSigdir').textContent = SIGDIR ? '⤢ Orijinal boyut' : '⤢ Sığdır';
    }
    function sigdirDegistir() { SIGDIR = !SIGDIR; try { localStorage.setItem('bleach.sigdir', SIGDIR ? '1' : '0'); } catch (e) { } yerlestir(); }
    window.addEventListener('resize', yerlestir);
    document.getElementById('btnSigdir').addEventListener('click', sigdirDegistir);
    document.addEventListener('keydown', function (e) { if (e.ctrlKey && e.shiftKey && (e.key === 'F' || e.key === 'f')) sigdirDegistir(); });
    yerlestir();

  </script>
  <script src="/gorsel/myoboku.js?v=2026102515"></script>
  <script src="/gorsel/alliance-war.js?v=2026102605"></script>
</body>

</html>
