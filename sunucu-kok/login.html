<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bleach Online · Tài khoản</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#303047,#0b0c15 70%);color:#eee;font:16px Arial,sans-serif}.card{width:400px;max-width:94vw;padding:36px;border:1px solid #565063;border-radius:16px;background:#151522;box-shadow:0 25px 90px #0008}h1{margin:0;color:#ffbe68;letter-spacing:3px;font-size:27px}p{color:#aaa;line-height:1.6}.tabs{display:flex;gap:10px;margin:28px 0 20px}button,input{font:inherit;border-radius:7px}button{cursor:pointer;padding:12px;border:1px solid #65533c;background:#292535;color:#ddd}.tabs button{flex:1}.tabs button.active,button[type=submit]{background:#e3a351;color:#19141b;font-weight:bold}label{display:block;margin:18px 0 8px}input{width:100%;padding:13px;background:#0c0d16;border:1px solid #51495e;color:white}button[type=submit]{width:100%;margin-top:24px}button:disabled{opacity:.6;cursor:wait}#message{color:#ffab9d;min-height:38px;margin-top:18px;line-height:1.5}small{color:#9290a2}</style></head>
<body><main class="card"><h1>BLEACH ONLINE</h1><p>Đăng nhập để tiếp tục hành trình của bạn.</p><div class="tabs"><button id="login" class="active" type="button">Đăng nhập</button><button id="register" type="button">Đăng ký</button></div><form id="form"><label for="username">Tài khoản</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]+"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><div id="confirmation" hidden><label for="confirm">Nhập lại mật khẩu</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128"></div><button id="submit" type="submit">Đăng nhập</button><div id="message" role="alert" aria-live="polite"></div></form><small>Tiến trình được lưu riêng cho từng tài khoản.</small></main>
<script>var mode='login';function selectMode(next){mode=next;document.getElementById('login').className=mode==='login'?'active':'';document.getElementById('register').className=mode==='register'?'active':'';document.getElementById('confirmation').hidden=mode!=='register';document.getElementById('confirm').required=mode==='register';document.getElementById('password').minLength=mode==='register'?6:1;document.getElementById('password').autocomplete=mode==='register'?'new-password':'current-password';document.getElementById('submit').textContent=mode==='register'?'Tạo tài khoản':'Đăng nhập';document.getElementById('message').textContent='';}document.getElementById('login').onclick=function(){selectMode('login')};document.getElementById('register').onclick=function(){selectMode('register')};document.getElementById('form').onsubmit=function(e){e.preventDefault();var button=document.getElementById('submit'),message=document.getElementById('message'),password=document.getElementById('password').value;if(mode==='register'&&password!==document.getElementById('confirm').value){message.textContent='Mật khẩu nhập lại chưa khớp';return;}button.disabled=true;message.textContent='Đang xử lý…';fetch('/auth/'+mode,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:password})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error);location.href=location.search.indexOf('next=admin')!==-1?'/admin':'/';})}).catch(function(err){message.textContent=err.message||'Không thể kết nối máy chủ';button.disabled=false;});};</script></body></html>
